services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openmu}
      POSTGRES_USER: ${POSTGRES_USER:-openmu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - openmu-web-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  player-web:
    build:
      context: .
      args:
        VITE_CLIENT_DOWNLOAD_URL: ${VITE_CLIENT_DOWNLOAD_URL:?set VITE_CLIENT_DOWNLOAD_URL}
        VITE_CLIENT_SIZE: ${VITE_CLIENT_SIZE:-2.1 GB}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENMU_API_URL: ${OPENMU_API_URL:?set OPENMU_API_URL}
      OPENMU_API_KEY: ${OPENMU_API_KEY:?set OPENMU_API_KEY}
      DATABASE_URL: postgres://${POSTGRES_USER:-openmu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openmu}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PROMPTPAY_ID: ${PROMPTPAY_ID:-}
      PROMPTPAY_NAME: ${PROMPTPAY_NAME:-OpenMU-Origins}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      TRUST_PROXY: "true"
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-8000}
    ports:
      - "${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  openmu-web-postgres:
